# Nginx for LabelVerify frontend container (production static + API proxy).
# Architectural responsibility: same-origin API proxy, security headers, SPA fallback.
#
# Cloudflare Tunnel terminates external HTTPS and connects to http://localhost:8080.
# Preserve tunnel-provided X-Forwarded-Proto when present; fall back to $scheme locally.

map $http_x_forwarded_proto $labelverify_forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (prototype hardening — not a full ATO package).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; frame-ancestors 'none';" always;

    # Optional HTTP Basic Auth when ACCESS_HTPASSWD_FILE is mounted (see docs/DEPLOYMENT.md).
    # Prefer Cloudflare Access for evaluator-facing HTTPS. Uncomment only as a last resort:
    # auth_basic "LabelVerify prototype";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $labelverify_forwarded_proto;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $labelverify_forwarded_proto;
        proxy_set_header X-Request-ID $http_x_request_id;
    }

    location /ready {
        proxy_pass http://backend:8000/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $labelverify_forwarded_proto;
        proxy_set_header X-Request-ID $http_x_request_id;
    }
}
