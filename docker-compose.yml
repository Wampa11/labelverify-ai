# LabelVerify release-candidate Compose stack.
# Architectural responsibility: production-like frontend+backend for Docker demos.
#
# Local backend (uvicorn): use backend/.env (from backend/.env.example).
# Compose secrets: populate backend/.env (injected) and/or root `.env` for interpolation.
#   cp backend/.env.example backend/.env
#   # optionally also: cp .env.example .env
#   docker compose up --build -d
#   open http://localhost:8080
#
# Frontend publishes to loopback by default (127.0.0.1) so cloudflared on the same
# host can reach localhost:8080 without exposing the UI on every LAN interface.
# cloudflared is a host service — never part of this Compose stack.
#
# Never bake secrets into images. OpenAI remains optional for readiness.

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    # Inject backend local/deploy secrets without baking them into the image.
    # OS/Compose `environment` below still wins for the listed non-secret defaults.
    env_file:
      - path: ./backend/.env
        required: false
      - path: .env
        required: false
    environment:
      APP_ENV: production
      APP_VERSION: ${APP_VERSION:-0.8.0}
      # Prefer same-origin via frontend proxy; CORS list for direct API access if needed.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      OCR_PROVIDER: tesseract
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: sqlite:///./data/labelverify.db
      UPLOAD_DIR: ./data/uploads
      # OpenAI: do NOT set empty defaults here — that would override backend/.env.
      # Supply via backend/.env (env_file) or host/root Compose env when needed:
      # OPENAI_ENABLED, OPENAI_API_KEY, OPENAI_MODEL, OPENAI_TIMEOUT_SECONDS, etc.
    volumes:
      - backend-data:/app/data
    # Backend not published to host by default — reach via frontend nginx proxy.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_APP_VERSION: ${APP_VERSION:-0.8.0}
    restart: unless-stopped
    # Loopback-only by default: local UI + same-host cloudflared; not LAN-wide.
    # Override FRONTEND_BIND_HOST=0.0.0.0 only for rare LAN demos (not required for Cloudflare).
    ports:
      - "${FRONTEND_BIND_HOST:-127.0.0.1}:${FRONTEND_HOST_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
